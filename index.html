<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumple Antonella 🎉</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#ff2d95">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff6ec7 100%);
    min-height: 100vh;
    color: #4a004a;
    text-align: center;
    padding: 30px 20px 60px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  h3 {
    font-weight: 500;
    margin-top: 0;
  }
  .foto {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid #ff2d95;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    margin: 20px auto;
    display: block;
  }
  button {
    background-color: #ff2d95;
    color: white;
    font-size: 20px;
    font-weight: bold;
    border-radius: 50px;
    padding: 15px 40px;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    cursor: pointer;
    margin: 10px;
  }
  button:hover { background-color: #ff69c9; }
  button:active { transform: scale(0.97); }

  .mensaje {
    background-color: white;
    border-radius: 20px;
    padding: 25px;
    margin: 20px auto;
    max-width: 420px;
    font-size: 19px;
    font-weight: 600;
    color: #d6006c;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    display: none;
  }
  .juego {
    margin-top: 40px;
    background: rgba(255,255,255,0.5);
    border-radius: 20px;
    padding: 20px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  input[type=number] {
    font-size: 18px;
    padding: 8px;
    width: 80px;
    border-radius: 10px;
    border: 2px solid #ff2d95;
    text-align: center;
    margin-right: 10px;
  }
  #resultado { margin-top: 12px; font-weight: 600; }

  .banner-instalar {
    display: none;
    background: white;
    border-radius: 16px;
    padding: 16px 20px;
    max-width: 420px;
    margin: 0 auto 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  .banner-instalar p {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 600;
    color: #d6006c;
  }
  .banner-instalar button {
    margin: 0;
    font-size: 17px;
    padding: 10px 28px;
  }
  footer {
    margin-top: 50px;
    font-size: 13px;
    opacity: 0.7;
  }
  .confetti {
    position: fixed;
    top: -10px;
    font-size: 22px;
    animation: caer linear forwards;
    pointer-events: none;
  }
  @keyframes caer {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }
</style>
</head>
<body>

  <div id="instalarBanner" class="banner-instalar">
    <p>📲 Instala esta app para tenerla siempre en tu celular</p>
    <button id="instalarBtn">⬇️ Instalar App</button>
  </div>

  <h1>🎉 ¡Feliz Cumpleaños, Antonella! 🎉</h1>
  <h3>11 años de pura magia 💗✨</h3>

  <img src="antonella.jpg" alt="Antonella" class="foto">

  <p style="font-size:18px;">Toca el corazón cada día y recibe un mensaje de amor de tu papá 💌</p>
  <button id="mensajeBtn">💖 Toca aquí 💖</button>
  <div class="mensaje" id="mensajeCaja"></div>

  <div class="juego">
    <h3>🎁 Bonus: Adivina mi número secreto 🎁</h3>
    <p>Pensé un número entre 1 y 20... ¿lo adivinas?</p>
    <input type="number" id="intento" min="1" max="20">
    <button id="adivinarBtn">Adivinar 🎯</button>
    <div id="resultado"></div>
  </div>

  <footer>Hecho con 💗 por tu papá</footer>

<script>
  const mensajes = [
    "Antonella, eres el regalo más grande que la vida me ha dado. 💗",
    "No importa cuántos años cumplas, para mí siempre serás mi niña. 🎀",
    "Estoy tan orgulloso de la persona en la que te estás convirtiendo. ✨",
    "Cada día contigo es mi día favorito. Te amo infinito. 💕",
    "Eres fuerte, eres valiente, eres increíble. Nunca lo olvides. 🌸",
    "Gracias por llenar mi vida de risas y colores. Te amo, hija. 🎈",
    "Donde sea que estés, mi corazón siempre va contigo. 💖",
    "Eres mi razón para ser mejor cada día. Feliz cumpleaños, mi amor. 🎂",
    "Tus sueños son importantes para mí. Siempre voy a apoyarte. 🌟",
    "Te quiero tal como eres, hoy y siempre. 💗",
    "Ver crecer a una persona tan especial como tú es mi mayor orgullo. 🦋",
    "No hay distancia ni tiempo que cambie lo mucho que te amo. 💞",
    "Eres luz en mi vida, Antonella. Feliz cumpleaños, princesa. 👑",
    "Cuenta siempre conmigo, pase lo que pase. Te amo con todo mi corazón. 💗",
    "Cada logro tuyo, por pequeño que sea, me llena de alegría. 🎉",
  ];

  function confeti() {
    const emojis = ["🎈","🎉","💗","✨","🎀"];
    for (let i = 0; i < 25; i++) {
      const span = document.createElement("span");
      span.className = "confetti";
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.left = Math.random()*100 + "vw";
      span.style.animationDuration = (2 + Math.random()*2) + "s";
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 4000);
    }
  }
  window.addEventListener("load", confeti);

  document.getElementById("mensajeBtn").addEventListener("click", () => {
    const caja = document.getElementById("mensajeCaja");
    caja.textContent = mensajes[Math.floor(Math.random()*mensajes.length)];
    caja.style.display = "block";
    confeti();
  });

  let numeroSecreto = Math.floor(Math.random()*20) + 1;
  document.getElementById("adivinarBtn").addEventListener("click", () => {
    const intento = parseInt(document.getElementById("intento").value);
    const resultado = document.getElementById("resultado");
    if (!intento) {
      resultado.textContent = "Escribe un número primero 🙂";
    } else if (intento === numeroSecreto) {
      resultado.textContent = "¡SÍ! ¡Lo adivinaste! Eres una genio 🌟";
      confeti();
      numeroSecreto = Math.floor(Math.random()*20) + 1;
    } else if (intento < numeroSecreto) {
      resultado.textContent = "Un poquito más alto... 🔼";
    } else {
      resultado.textContent = "Un poquito más bajo... 🔽";
    }
  });

  // ---- Instalación como app (PWA) ----
  let deferredPrompt;
  const instalarBtn = document.getElementById("instalarBtn");
  const instalarBanner = document.getElementById("instalarBanner");

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    instalarBanner.style.display = "block";
  });

  instalarBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    instalarBanner.style.display = "none";
  });

  // Si ya está instalada, ocultar el banner
  window.addEventListener("appinstalled", () => {
    instalarBanner.style.display = "none";
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
